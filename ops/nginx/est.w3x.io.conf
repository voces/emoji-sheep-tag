server {
    listen 80;
    listen 443 ssl;
    listen [::]:80;
    listen [::]:443 ssl;

    server_name est.w3x.io;

    ssl_certificate /etc/letsencrypt/live/w3x.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/w3x.io/privkey.pem;

    ssl_session_cache builtin:1000 shared:SSL:10m;
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    ssl_ciphers HIGH:!aNULL:!eNULL:!EXPORT:!CAMELLIA:!DES:!MD5:!PSK:!RC4;
    ssl_prefer_server_ciphers on;

    location /.well-known/acme-challenge/ {
        alias /home/ubuntu/wc3lobbylist/src/w3xio/public/.well-known/acme-challenge/;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        # Sockets sit idle while a round runs on a shard; nginx's 60s default
        # would drop them.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        include /etc/nginx/proxy_params;
    }
}
